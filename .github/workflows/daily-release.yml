name: Daily Desktop and npm release

on:
  schedule:
    # GitHub cron is UTC. 10:00 UTC is 18:00 in Asia/Shanghai.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-daily-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      has-changes: ${{ steps.release.outputs.has-changes }}
      npm-version: ${{ steps.release.outputs.npm-version }}
      display-version: ${{ steps.release.outputs.display-version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout main with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve today's release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export TZ=Asia/Shanghai
          display_version="$(date +'%Y.%m.%d')"
          npm_version="$(date +'%Y.%-m.%-d')"
          tag="v${display_version}"
          should_release=false
          has_changes=true

          git fetch --force --tags origin
          latest_release_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "${latest_release_tag}" ]] \
            && git rev-parse --verify --quiet "refs/tags/${latest_release_tag}" >/dev/null \
            && git merge-base --is-ancestor "${latest_release_tag}" HEAD \
            && [[ "$(git rev-list --count "${latest_release_tag}..HEAD")" == "0" ]]; then
            has_changes=false
          fi

          release_is_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "${release_is_draft}" != "false" && "${has_changes}" == "true" ]]; then
            should_release=true
          fi

          release_sha="$(git rev-parse HEAD)"
          if [[ "${should_release}" == "true" ]]; then
            node scripts/set-release-version.mjs "${npm_version}"
            if ! git diff --quiet -- package.json desktop/package.json; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add package.json desktop/package.json
              git commit -m "chore(release): ${display_version} [skip ci]"
              git push origin HEAD:main
              release_sha="$(git rev-parse HEAD)"
            fi
          fi

          echo "release=${should_release}" >> "${GITHUB_OUTPUT}"
          echo "has-changes=${has_changes}" >> "${GITHUB_OUTPUT}"
          echo "npm-version=${npm_version}" >> "${GITHUB_OUTPUT}"
          echo "display-version=${display_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

  build-desktop:
    if: needs.prepare.outputs.release == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Desktop
        run: pnpm --filter ./desktop run lint

      - name: Verify memory release policy
        run: pnpm run test:memory:release

      - name: Package Desktop
        run: pnpm --filter ./desktop run package:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify unsigned Windows installer
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/release/*.exe)
          if ($installers.Count -eq 0) { throw 'Windows installer was not produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned Windows installer, got $($signature.Status): $($installer.Name)"
            }
          }

      - name: Verify ad-hoc macOS app without Developer ID
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find desktop/release -maxdepth 2 -type d -name '*.app' -print -quit)"
          disk_image="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "${app_bundle}"
          test -n "${disk_image}"
          signature_details="$(codesign --display --verbose=4 "${app_bundle}" 2>&1)"
          grep -q 'Signature=adhoc' <<< "${signature_details}"
          if grep -q '^Authority=' <<< "${signature_details}"; then
            echo "Expected no Apple Developer ID authority: ${app_bundle}" >&2
            exit 1
          fi
          if codesign --verify --verbose=2 "${disk_image}" 2>/dev/null; then
            echo "Expected the macOS disk image itself to have no distribution signature: ${disk_image}" >&2
            exit 1
          fi

      - name: Run packaged Zvec smoke
        run: node scripts/run-packaged-zvec-smoke.mjs

      - name: Upload Desktop package
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}-${{ needs.prepare.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  build-npm-package:
    if: needs.prepare.outputs.release == 'true'
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.npm-version }}
        run: |
          set -euo pipefail
          cli_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          [[ "${cli_version}" == "${EXPECTED_VERSION}" ]]
          [[ "${desktop_version}" == "${EXPECTED_VERSION}" ]]

      - name: Build and inspect npm package
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          mkdir -p npm-package
          npm pack --json --pack-destination npm-package > npm-package/manifest.json
          package_file="$(node -p "JSON.parse(require('fs').readFileSync('npm-package/manifest.json', 'utf8'))[0].filename")"
          test -f "npm-package/${package_file}"
          tar -tzf "npm-package/${package_file}" | grep -x 'package/dist/index.js'
          tar -tzf "npm-package/${package_file}" | grep -x 'package/package.json'
          node scripts/create-github-npm-package.mjs "npm-package/${package_file}" npm-package
          github_package_file="$(node -p "JSON.parse(require('fs').readFileSync('npm-package/github-manifest.json', 'utf8'))[0].filename")"
          test -f "npm-package/${github_package_file}"

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ needs.prepare.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: npm-package/*

  publish:
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, build-desktop, build-npm-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Verify synchronized versions
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.npm-version }}
        run: |
          set -euo pipefail
          cli_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          [[ "${cli_version}" == "${EXPECTED_VERSION}" ]]
          [[ "${desktop_version}" == "${EXPECTED_VERSION}" ]]

      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package-${{ needs.prepare.outputs.sha }}
          path: npm-package

      - name: Attest npm package artifacts
        uses: actions/attest@v4
        with:
          subject-path: npm-package/*.tgz

      - name: Publish CLI to npm once
        shell: bash
        env:
          NPM_VERSION: ${{ needs.prepare.outputs.npm-version }}
        run: |
          set -euo pipefail
          if npm view "open-agent-team@${NPM_VERSION}" version >/dev/null 2>&1; then
            echo "open-agent-team@${NPM_VERSION} is already published; skipping npm publish."
          else
            package_file="$(node -p "JSON.parse(require('fs').readFileSync('npm-package/manifest.json', 'utf8'))[0].filename")"
            test -f "npm-package/${package_file}"
            npm publish "./npm-package/${package_file}" --access public --provenance
          fi

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com/
          scope: '@herberthe'
          package-manager-cache: false

      - name: Publish CLI to GitHub Packages once
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_VERSION: ${{ needs.prepare.outputs.npm-version }}
        run: |
          set -euo pipefail
          if npm view "@herberthe/open-agent-team@${NPM_VERSION}" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "@herberthe/open-agent-team@${NPM_VERSION} is already published; skipping GitHub Packages publish."
          else
            package_file="$(node -p "JSON.parse(require('fs').readFileSync('npm-package/github-manifest.json', 'utf8'))[0].filename")"
            test -f "npm-package/${package_file}"
            npm publish "./npm-package/${package_file}" --registry https://npm.pkg.github.com/
          fi

      - name: Download Desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-${{ needs.prepare.outputs.sha }}
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cp .github/UNSIGNED-BUILD-NOTICE.txt release-assets/UNSIGNED-BUILD-NOTICE.txt
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Attest Desktop release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish the daily GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DISPLAY_VERSION: ${{ needs.prepare.outputs.display-version }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          UNSIGNED_NOTICE: >-
            ⚠️ Untrusted Desktop build: the Windows installer has no Authenticode signature; the macOS app uses only a certificate-free ad-hoc signature and has no Apple Developer ID or notarization. Verify SHA256SUMS.txt and the GitHub Artifact Attestation before installation. Windows may show an Unknown publisher/SmartScreen warning; macOS may require System Settings → Privacy & Security → Open Anyway.
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --draft \
              --target "${TARGET_SHA}" \
              --title "OAT ${DISPLAY_VERSION}" \
              --notes "${UNSIGNED_NOTICE}" \
              --generate-notes
          fi
          gh release upload "${TAG}" "${assets[@]}" --clobber
          gh release edit "${TAG}" --draft=false --latest
